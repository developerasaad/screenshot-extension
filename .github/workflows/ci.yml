name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Validate build output
        run: |
          test -d dist || { echo "Error: dist directory does not exist."; exit 1; }
          test -f dist/manifest.json || { echo "Error: dist/manifest.json does not exist."; exit 1; }
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
            if (!manifest.name) throw new Error('Manifest is missing name');
            if (!manifest.version) throw new Error('Manifest is missing version');
            if (manifest.manifest_version !== 3) throw new Error('Expected Manifest V3');
            if (!manifest.background?.service_worker) throw new Error('Missing service worker');
            console.log('Manifest validation successful: ' + manifest.name + ' v' + manifest.version);
          "
